# Runs the tests and a production build on every push and pull request.
# Deploying is done by Cloudflare Pages, which builds the main branch on its own.
name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc -p .
      - run: npm test
      - run: npm run build
