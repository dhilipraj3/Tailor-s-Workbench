<title>Tailor's Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Nunito:wght@600;800&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* Layout: picture-book player. Home = garment + size picker + chapter path; Player = big animated stage (cutting mat), tiny caption, huge buttons */
:root{
  --bg:#eef2ef; --surface:#ffffff; --surface-2:#f4f7f5; --ink:#17262b; --muted:#5b6d6f; --line:#d3ddd9;
  --accent:#f2c230; --accent-ink:#1b2326; --good:#2b8a57;
  --mat:#1d5646; --mat-line:rgba(255,255,255,.08);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1614; --surface:#17201d; --surface-2:#1c2723; --ink:#e5ece9; --muted:#9aaca7; --line:#2a3833;
  --accent:#f2c230; --accent-ink:#1b2326; --good:#5cc28a; --mat:#163f34; --mat-line:rgba(255,255,255,.06); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1614; --surface:#17201d; --surface-2:#1c2723; --ink:#e5ece9; --muted:#9aaca7; --line:#2a3833;
  --accent:#f2c230; --accent-ink:#1b2326; --good:#5cc28a; --mat:#163f34; --mat-line:rgba(255,255,255,.06); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.tape{height:22px;border-radius:6px;background:
  repeating-linear-gradient(90deg,var(--accent-ink) 0 2px,transparent 2px 60px) 0 0/100% 14px no-repeat,
  repeating-linear-gradient(90deg,var(--accent-ink) 0 1px,transparent 1px 12px) 0 0/100% 7px no-repeat,var(--accent)}
h1{font-family:var(--f-display);font-size:2.2rem;line-height:1;margin:14px 0 0;text-transform:uppercase;letter-spacing:.03em}
.label{font-family:var(--f-display);font-size:1.15rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.garments{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.gcard{border:3px solid var(--line);background:var(--surface);border-radius:18px;padding:10px;display:grid;justify-items:center;gap:4px;font-family:var(--f-display);font-size:1.5rem;font-weight:700}
.gcard svg{width:min(150px,100%);height:auto}
.gcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent) inset}
.sizes{display:flex;flex-wrap:wrap;gap:10px}
.sz{border:3px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 10px 4px;display:grid;justify-items:center;min-width:66px;font-family:var(--f-display);font-size:1.35rem;font-weight:700}
.sz[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.sz svg{height:44px;width:auto;display:block}
.toggles{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.tog{border:3px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;display:flex;gap:8px;align-items:center;font-weight:800}
.tog[aria-pressed="true"]{border-color:var(--ink)}
.tog svg{width:24px;height:24px}
.path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:640px){.path{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ch{position:relative;border:3px solid var(--line);background:var(--surface);border-radius:20px;padding:12px 10px 12px;display:grid;justify-items:center;gap:6px;text-align:center}
.ch .num{position:absolute;top:8px;left:10px;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-size:1rem}
.ch.done .num{background:var(--good)}
.ch.next{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent) inset}
.ch svg.ci{width:96px;height:96px}
.ch b{font-family:var(--f-display);font-size:1.45rem;line-height:1}
.bar{width:80%;height:8px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
/* player */
.player{display:grid;gap:10px}
.pbar{display:flex;align-items:center;gap:10px}
.icon-btn{width:52px;height:52px;border-radius:50%;border:3px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:26px;height:26px}
.ptitle{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:1.5rem;font-weight:700;min-width:0}
.ptitle svg{width:40px;height:40px;flex:none}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-left:auto;justify-content:flex-end;max-width:45%}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--good)}
.dots i.cur{background:var(--accent);outline:2px solid var(--ink)}
.stage{background:var(--mat);border-radius:18px;overflow:hidden;cursor:pointer}
.stage svg{display:block;width:100%;height:auto;max-height:66vh}
.cap{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-size:1.9rem;font-weight:700;line-height:1.05;min-height:52px}
.cap .n{font-family:var(--f-mono);font-size:1rem;background:var(--ink);color:var(--bg);border-radius:10px;padding:4px 8px;flex:none}
.ctrls{display:grid;grid-template-columns:1fr auto auto 1fr;gap:12px;align-items:center}
.big{height:72px;border-radius:20px;border:3px solid var(--ink);background:var(--surface);display:grid;place-items:center}
.big svg{width:40px;height:40px}
.big.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.big.round{width:72px;border-radius:50%}
.big:disabled{opacity:.3;cursor:default}
.big.speaking{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(242,194,48,.35)}}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px}
.stepper button{width:64px;height:64px;border-radius:50%;border:3px solid var(--ink);background:var(--surface);font-size:2rem;font-weight:800;line-height:1}
.stepper output{font-family:var(--f-mono);font-size:2rem;min-width:150px;text-align:center;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:6px 14px}

/* stage art (stage is a fixed dark mat in both themes, so colours here are deliberate constants) */
.matbg{fill:var(--mat)}
.fr{fill:#4f86d1;stroke:#1d3c69;stroke-width:2.5;stroke-linejoin:round}
.fr2{fill:#356bb7;stroke:#1d3c69;stroke-width:2.5;stroke-linejoin:round}
.fw{fill:url(#hS);stroke:#1d3c69;stroke-width:2.5;stroke-linejoin:round}
.pr{fill:#66717d;stroke:#252b31;stroke-width:2.5;stroke-linejoin:round}
.pr2{fill:#535d68;stroke:#252b31;stroke-width:2.5;stroke-linejoin:round}
.pw{fill:url(#hP);stroke:#252b31;stroke-width:2.5;stroke-linejoin:round}
.lin{fill:#efece2;stroke:#8f8b7c;stroke-width:2}
.intf{fill:url(#dots);stroke:#a7a290;stroke-width:2}
.paperpc{fill:#e9d9b3;stroke:#7c6a45;stroke-width:2}
.kraft{fill:#eadcbc}
.mann{fill:#c9d5d1;stroke:#7d8f8a;stroke-width:2}
.stitch{fill:none;stroke:#ffd84a;stroke-width:3.5;stroke-dasharray:9 6;stroke-linecap:round}
.stitch.solid{stroke-dasharray:none;stroke-width:2.5}
.chalkl{fill:none;stroke:#ffffff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.chalkd{fill:none;stroke:#ffffff;stroke-width:3;stroke-dasharray:10 7;stroke-linecap:round}
.cutl{fill:none;stroke:#ffffff;stroke-width:2.5;stroke-dasharray:4 7}
.arrowl{fill:none;stroke:#ffffff;stroke-width:4;stroke-linecap:round}
.tapel{fill:none;stroke:#f2c230;stroke-width:7;stroke-linecap:round}
.foldl{fill:none;stroke:#ffd84a;stroke-width:3;stroke-dasharray:14 8}
.pencil{fill:none;stroke:#26282a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pencilg{fill:none;stroke:#7a6c4d;stroke-width:1.6;stroke-dasharray:7 6}
.redm{fill:none;stroke:#c2410c;stroke-width:3;stroke-dasharray:9 6;stroke-linecap:round}
.dimln{fill:none;stroke:#1f6fd6;stroke-width:2.5}
.saband{fill:none;stroke:rgba(31,111,214,.28);stroke-linejoin:round}
.ptdot{fill:#c2410c}
.ptlet{fill:#1b2326;font:800 20px var(--f-body)}
.chipbg{fill:#ffd84a;stroke:#1b2326;stroke-width:2}
.chipt{fill:#1b2326;font:700 21px var(--f-mono);text-anchor:middle;dominant-baseline:central}
.wordt{fill:#ffffff;font:700 24px var(--f-display);text-anchor:middle;letter-spacing:.04em}
.wordk{fill:#1b2326;font:700 22px var(--f-display);text-anchor:middle;letter-spacing:.04em}
.metal{fill:#d3dadd;stroke:#4f5a63;stroke-width:2}
.needle{stroke:#eef2f4;stroke-width:3;stroke-linecap:round}
.ironb{fill:#eef2f4;stroke:#4f5a63;stroke-width:2.5}
.irons{fill:#f2c230;stroke:#4f5a63;stroke-width:2.5}
.red{fill:#e5484d}
.okc{fill:#2fae69;stroke:#fff;stroke-width:4}
.noc{fill:#e5484d;stroke:#fff;stroke-width:4}
.mark{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.ring{fill:none;stroke:#ffd84a;stroke-width:4}
.mach{fill:#f1f3f2;stroke:#3a464d;stroke-width:3;stroke-linejoin:round}
.machd{fill:#cfd8d6;stroke:#3a464d;stroke-width:3}
.thread{fill:none;stroke:#e5484d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.steam{fill:none;stroke:rgba(255,255,255,.7);stroke-width:3;stroke-linecap:round}
.tapp{cursor:pointer}
.tapp:hover rect.tilebg{fill:rgba(255,255,255,.14)}
.tilebg{fill:rgba(255,255,255,.07)}

/* animation primitives */
.drw{stroke-dasharray:1 1;stroke-dashoffset:1;animation:drw var(--t) var(--d) ease-in-out forwards}
@keyframes drw{to{stroke-dashoffset:0}}
.fi{opacity:0;animation:fi .45s var(--d) forwards}
@keyframes fi{to{opacity:1}}
.fo{animation:fo .45s var(--d) forwards}
@keyframes fo{to{opacity:0}}
.mv{animation:mv var(--t) var(--d) both cubic-bezier(.3,.7,.3,1)}
@keyframes mv{from{transform:translate(var(--fx),var(--fy))}to{transform:none}}
.flipx,.flipy,.rot{transform-box:view-box}
.flipx{transform-origin:var(--o) 0;animation:flipx var(--t) var(--d) forwards ease-in-out}
.flipy{transform-origin:0 var(--o);animation:flipy var(--t) var(--d) forwards ease-in-out}
@keyframes flipx{to{transform:scaleX(-1)}}
@keyframes flipy{to{transform:scaleY(-1)}}
.rot{transform-origin:var(--ox) var(--oy);animation:rot var(--t) var(--d) forwards ease-in-out}
@keyframes rot{to{transform:rotate(var(--r))}}
.slide{animation:slide .9s var(--d) var(--n) alternate ease-in-out}
@keyframes slide{to{transform:translate(var(--dx),var(--dy))}}
.pul{transform-box:fill-box;transform-origin:center;animation:pul 1s var(--d) infinite}
@keyframes pul{50%{transform:scale(1.25)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s var(--d) both cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.drw,.fi,.fo,.mv,.flipx,.flipy,.rot,.slide,.pul,.pop{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>

<div class="wrap" id="app"></div>

<script>
(function(){
/* ================= state ================= */
const KEY='tailorsWorkbench.v2';
const SHIRT_SIZES={S:{chest:38,neck:15,shoulder:17,sleeve:24.5,length:29,wrist:6.5},M:{chest:40,neck:15.5,shoulder:17.5,sleeve:25,length:29.5,wrist:7},L:{chest:42,neck:16,shoulder:18,sleeve:25.5,length:30,wrist:7},XL:{chest:44,neck:16.5,shoulder:18.5,sleeve:26,length:30.5,wrist:7.5},XXL:{chest:46,neck:17.5,shoulder:19,sleeve:26.5,length:31,wrist:7.5}};
const PANT_SIZES=[28,30,32,34,36,38,40,42,44];
const r4=x=>Math.round(x*4)/4, r2=x=>Math.round(x*2)/2;
const pantPreset=w=>({waist:w,hip:w+6,rise:r4((w+6)/8+5.5),outseam:r4(40+(w-28)*.125),bottom:r2(15.5+(w-28)*.2)});
let S={garment:'shirt',unit:'in',shirtSize:'L',pantSize:34,fit:'regular',shirt:{...SHIRT_SIZES.L},pant:pantPreset(34),seen:{},voice:true,view:null};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.shirt&&s.pant)S={...S,...s,view:null};}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({...S,view:null}));}catch(e){}};

/* ================= numbers ================= */
const FR=['','⅛','¼','⅜','½','⅝','¾','⅞'];
const FRW=['','one eighth','a quarter','three eighths','a half','five eighths','three quarters','seven eighths'];
function split8(x){let w=Math.floor(x),e=Math.round((x-w)*8);if(e===8){w++;e=0;}return [w,e];}
function f(x){if(S.unit==='cm')return (Math.round(x*25.4)/10).toFixed(1).replace(/\.0$/,'')+' cm';const[w,e]=split8(Math.abs(x));return ((w||!e)?w:'')+FR[e]+'″';}
function sn(x){if(S.unit==='cm')return (Math.round(x*25.4)/10).toFixed(1).replace(/\.0$/,'')+' centimetres';const[w,e]=split8(Math.abs(x));
  if(!e)return w+(w===1?' inch':' inches'); if(!w)return FRW[e]+' of an inch'; return w+' and '+FRW[e]+' inches';}

/* ================= svg helpers ================= */
let uid=0;
const n1=v=>(+v).toFixed(1);
const TR=(d,fn)=>d.replace(/(-?\d*\.?\d+)[ ,]+(-?\d*\.?\d+)/g,(m,a,b)=>{const p=fn(+a,+b);return n1(p[0])+' '+n1(p[1]);});
const P=(d,ox,oy,s,sx=1)=>TR(d,(x,y)=>[ox+x*s*sx,oy+y*s]);
const st=(d0,t)=>`style="--d:${d0}s;--t:${t}s"`;
const H={
  shape:(d,cls,extra='')=>`<path d="${d}" class="${cls}" ${extra}/>`,
  draw:(d,cls,d0=0,t=1)=>`<path d="${d}" pathLength="1" class="${cls} drw" ${st(d0,t)}/>`,
  follow:(d,d0,t,icon,auto)=>`<g visibility="hidden"><set attributeName="visibility" to="visible" begin="${d0}s" fill="freeze"/><set attributeName="visibility" to="hidden" begin="${(d0+t+.4).toFixed(2)}s" fill="freeze"/>${icon}<animateMotion dur="${t}s" begin="${d0}s" fill="freeze" path="${d}" ${auto?'rotate="auto"':''}/></g>`,
  stitch:(d,d0=0,t=2,tool='foot',cls='stitch')=>{const id='mk'+(uid++);return `<mask id="${id}" maskUnits="userSpaceOnUse" x="-200" y="-200" width="1200" height="900"><path d="${d}" pathLength="1" fill="none" stroke="#fff" stroke-width="22" class="drw" ${st(d0,t)}/></mask><path d="${d}" class="${cls}" mask="url(#${id})"/>${tool?H.follow(d,d0,t,ICON[tool]()):''}`;},
  cut:(d,d0=0,t=1.5)=>H.draw(d,'cutl',d0,t)+H.follow(d,d0,t,ICON.scissors(),true),
  fade:(inner,d0=0)=>`<g class="fi" style="--d:${d0}s">${inner}</g>`,
  out:(inner,d0=0)=>`<g class="fo" style="--d:${d0}s">${inner}</g>`,
  move:(inner,dx,dy,d0=0,t=1)=>`<g class="mv" style="--fx:${dx}px;--fy:${dy}px;--d:${d0}s;--t:${t}s">${inner}</g>`,
  flip:(inner,ax,o,d0=0,t=1)=>`<g class="flip${ax}" style="--o:${o}px;--d:${d0}s;--t:${t}s">${inner}</g>`,
  rot:(inner,ox,oy,r,d0=0,t=1)=>`<g class="rot" style="--ox:${ox}px;--oy:${oy}px;--r:${r}deg;--d:${d0}s;--t:${t}s">${inner}</g>`,
  pop:(inner,d0=0)=>`<g class="pop" style="--d:${d0}s">${inner}</g>`,
  arrow:(d,d0=0)=>H.fade(`<path d="${d}" class="arrowl" marker-end="url(#ah)"/>`,d0),
  chip:(x,y,txt,d0=0)=>{const w=String(txt).length*13+26;return H.pop(`<rect x="${x-w/2}" y="${y-19}" width="${w}" height="38" rx="12" class="chipbg"/><text x="${x}" y="${y+1}" class="chipt">${txt}</text>`,d0);},
  word:(x,y,txt,d0=0)=>H.fade(`<text x="${x}" y="${y}" class="wordt">${txt}</text>`,d0),
  ok:(x,y,d0=0)=>H.pop(`<circle cx="${x}" cy="${y}" r="34" class="okc"/><path d="M${x-15} ${y} l10 11 l20 -22" class="mark"/>`,d0),
  no:(x,y,d0=0,r=34)=>H.pop(`<circle cx="${x}" cy="${y}" r="${r}" class="noc"/><path d="M${x-r*.38} ${y-r*.38} l${r*.76} ${r*.76} M${x+r*.38} ${y-r*.38} l${-r*.76} ${r*.76}" class="mark"/>`,d0),
  pin:(x,y,d0=0)=>H.pop(`<line x1="${x-18}" y1="${y+12}" x2="${x+12}" y2="${y-8}" stroke="#e8ecef" stroke-width="3"/><circle cx="${x+14}" cy="${y-9}" r="7" class="red" stroke="#fff" stroke-width="1.5"/>`,d0),
  pins:(pts,d0=0,gap=.15)=>pts.map((p,i)=>H.pin(p[0],p[1],d0+i*gap)).join(''),
  iron:(x,y,d0=0,dx=120,dy=0,n=3)=>H.fade(`<g class="slide" style="--d:${d0}s;--dx:${dx}px;--dy:${dy}px;--n:${n}">${ICON.iron(x,y)}</g>`,d0),
  ring:(x,y,r,d0=0)=>H.fade(`<circle cx="${x}" cy="${y}" r="${r}" class="ring pul" style="--d:${d0}s"/>`,d0),
  dim:(a,b,val,d0=0,off=0)=>{const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L*off,ny=dx/L*off;
     const A=[a[0]+nx,a[1]+ny],B=[b[0]+nx,b[1]+ny],tx=-dy/L*8,ty=dx/L*8;
     return H.fade(`<path class="dimln" d="M${n1(A[0])} ${n1(A[1])} L${n1(B[0])} ${n1(B[1])} M${n1(A[0]-tx)} ${n1(A[1]-ty)} L${n1(A[0]+tx)} ${n1(A[1]+ty)} M${n1(B[0]-tx)} ${n1(B[1]-ty)} L${n1(B[0]+tx)} ${n1(B[1]+ty)}"/>`,d0)+H.chip((A[0]+B[0])/2,(A[1]+B[1])/2,typeof val==='number'?f(val):val,d0+.2);},
  zz:(pts,amp=6,step=11)=>{const o=[];for(let k=0;k<pts.length-1;k++){const a=pts[k],b=pts[k+1],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L,n=Math.max(2,Math.round(L/step));for(let i=(k?1:0);i<=n;i++){const t=i/n,s=i%2?amp:-amp;o.push(n1(a[0]+dx*t+nx*s)+' '+n1(a[1]+dy*t+ny*s));}}return 'M'+o.join(' L');},
};
const ICON={
  foot:()=>`<g><rect x="-6" y="-78" width="12" height="44" rx="3" class="metal"/><line x1="0" y1="-36" x2="0" y2="-2" class="needle"/><path d="M-26 -16 L20 -16 L28 -6 L-26 -6 Z" class="metal"/></g>`,
  hand:()=>`<g transform="rotate(-35)"><line x1="0" y1="0" x2="0" y2="-46" class="needle"/><ellipse cx="0" cy="-42" rx="2" ry="4" fill="none" stroke="#4f5a63" stroke-width="1.5"/><path d="M0 -46 C 10 -70 30 -60 40 -80" fill="none" stroke="#e5484d" stroke-width="2.5"/></g>`,
  scissors:()=>`<g><path d="M-8 -3 L34 -1 L-8 4 Z" class="metal" transform="rotate(-14)"/><path d="M-8 -4 L34 1 L-8 3 Z" class="metal" transform="rotate(14)"/><circle cx="-20" cy="-11" r="9" fill="none" stroke="#e5484d" stroke-width="5"/><circle cx="-20" cy="11" r="9" fill="none" stroke="#e5484d" stroke-width="5"/><circle r="3" fill="#4f5a63"/></g>`,
  iron:(x,y)=>`<g transform="translate(${x} ${y})"><path d="M-62 0 Q -60 -34 -16 -38 L 48 -38 L 54 0 Z" class="ironb"/><path d="M-64 0 L56 0 L56 6 L-64 6 Z" class="irons"/><path d="M-24 -38 Q -16 -66 28 -62 L 36 -38" fill="none" stroke="#4f5a63" stroke-width="9" stroke-linecap="round"/><circle cx="10" cy="-20" r="6" class="red"/><path d="M-40 -48 q-6 -10 0 -20 M-26 -52 q-6 -10 0 -20" class="steam"/></g>`,

function metres(){
  const isS=S.garment==='shirt';
  return [36,44,58].map(w=>{let n;
    if(isS){const Lp=S.shirt.length+2,SLp=S.shirt.sleeve-1;n=w===36?2*Lp+SLp+14:w===44?2*Lp+10:Lp+SLp+12;}

}

 {cap:'Sew the inside leg',say:'Now sew the inside leg seam, from the bottom up to the crotch. Match the knee marks. Do both legs.',svg:()=>{

   `<path d="${P(SH.pfront,330,30,2.8)}" class="pr"/>`+H.draw(P('M22 0 L25 150',330,30,2.8),'chalkd',.2,1.2)+H.iron(420,440,1.4,0,-320,2)},
 {cap:'You made trousers!',say:'Well done! You made your own trousers. Put them on and wear them proudly.',svg:()=>
   figure(FIG.ox,FIG.oy,FIG.s,{pants:'pr'})+[[180,120],[620,100],[650,330],[160,360],[560,200]].map((q,i)=>H.pop(`<path d="M${q[0]} ${q[1]-22} L${q[0]+7} ${q[1]-7} L${q[0]+23} ${q[1]-5} L${q[0]+11} ${q[1]+6} L${q[0]+14} ${q[1]+22} L${q[0]} ${q[1]+14} L${q[0]-14} ${q[1]+22} L${q[0]-11} ${q[1]+6} L${q[0]-23} ${q[1]-5} L${q[0]-7} ${q[1]-7} Z" fill="#f2c230"/>`,.3+i*.25)).join('')},

/* ================= chapters ================= */
const CHI={ // chapter icons (96x96)
  tools:`<rect width="96" height="96" rx="20" fill="var(--mat)"/><g transform="translate(48 50) scale(1.5) rotate(-35)">${ICON.scissors()}</g>`,
  machine:`<rect width="96" height="96" rx="20" fill="var(--mat)"/><g transform="translate(-2 30) scale(.33)">${machine(30,40,1)}</g>`,
  measure:`<rect width="96" height="96" rx="20" fill="var(--mat)"/><circle cx="44" cy="48" r="24" fill="#f2c230" stroke="#1b2326" stroke-width="3"/><circle cx="44" cy="48" r="8" fill="#1b2326"/><path d="M62 62 L86 70 L84 80 L58 72 Z" fill="#f2c230" stroke="#1b2326" stroke-width="2"/>`,
  pattern:`<rect width="96" height="96" rx="20" fill="#eadcbc"/><path d="M22 18 L22 80 L70 80 M22 18 L60 18 C 56 40 62 50 74 54 L70 80" fill="none" stroke="#26282a" stroke-width="4"/><circle cx="22" cy="18" r="5" fill="#c2410c"/>`,
  cut:`<rect width="96" height="96" rx="20" fill="var(--mat)"/><rect x="12" y="30" width="72" height="50" fill="#4f86d1"/><path d="M12 52 L84 52" stroke="#fff" stroke-width="3" stroke-dasharray="4 6"/><g transform="translate(58 52) scale(1.1)">${ICON.scissors()}</g>`,
  sew:()=>S.garment==='shirt'?`<rect width="96" height="96" rx="20" fill="var(--mat)"/><path d="${P(SH.shirt,8,14,.5)}" class="fr"/><path d="M48 22 L48 86" stroke="#ffd84a" stroke-width="3" stroke-dasharray="5 4"/>`:`<rect width="96" height="96" rx="20" fill="var(--mat)"/><path d="${P(SH.pants,24,10,.5)}" class="pr"/><path d="M47 14 L47 40" stroke="#ffd84a" stroke-width="3" stroke-dasharray="5 4"/>`,
};
function chapters(){
  const isS=S.garment==='shirt';
  return [
    {id:'tools',name:'Tools',shared:true,steps:TOOLS},
    {id:'machine',name:'Machine',shared:true,steps:MACHINE},
    {id:'measure',name:'Measure',steps:isS?MEASURE_SHIRT:MEASURE_PANT},
    {id:'pattern',name:'Draw pattern',steps:patternSteps()},
    {id:'cut',name:'Cut',steps:cutSteps()},
    {id:'sew',name:isS?'Sew the shirt':'Sew the trousers',steps:isS?SEW_SHIRT:SEW_PANT},
  ];
}
const seenKey=ch=>ch.shared?ch.id:S.garment+':'+ch.id;
const chIcon=id=>`<svg class="ci" viewBox="0 0 96 96" aria-hidden="true">${typeof CHI[id]==='function'?CHI[id]():CHI[id]}</svg>`;

/* ================= speech ================= */
const canSpeak='speechSynthesis' in window;
let speakingBtn=null;
function speak(text){
  if(!canSpeak)return;
  try{speechSynthesis.cancel();if(!text)return;const u=new SpeechSynthesisUtterance(text);u.rate=.92;
    u.onstart=()=>document.getElementById('b-say')?.classList.add('speaking');
    u.onend=u.onerror=()=>document.getElementById('b-say')?.classList.remove('speaking');
    speechSynthesis.speak(u);}catch(e){}
}

/* ================= UI ================= */
const IC={
  home:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 L12 3 L21 11 M5 9 V21 H19 V9"/></svg>`,
  prev:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 L7 12 L15 20"/></svg>`,
  next:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 L17 12 L9 20"/></svg>`,
  replay:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 A8 8 0 1 0 7 5.8 M4 4 V9 H9"/></svg>`,
  say:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" fill="currentColor"/><path d="M16 9 Q18 12 16 15 M18.5 6.5 Q22 12 18.5 17.5"/></svg>`,
  mute:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" fill="currentColor"/><path d="M16 9 L21 15 M21 9 L16 15"/></svg>`,
  star:`<svg viewBox="0 0 24 24"><path d="M12 2 L15 9 L22 9.5 L16.5 14 L18.5 21 L12 17 L5.5 21 L7.5 14 L2 9.5 L9 9 Z" fill="currentColor"/></svg>`,
};
const app=document.getElementById('app');
function renderHome(){
  const isS=S.garment==='shirt',chs=chapters();
  let nextIdx=chs.findIndex(c=>(S.seen[seenKey(c)]||0)<c.steps.length);if(nextIdx<0)nextIdx=-1;
  const shirtIcon=(sc)=>`<svg viewBox="-4 -6 168 166" style="height:${44*sc}px"><path d="${SH.shirt}" fill="#4f86d1" stroke="#1d3c69" stroke-width="5"/><path d="${SH.collar}" fill="#fff" stroke="#1d3c69" stroke-width="4"/></svg>`;
  const pantIcon=()=>`<svg viewBox="-6 -4 102 168"><path d="${SH.pants}" fill="#66717d" stroke="#252b31" stroke-width="5"/></svg>`;
  app.innerHTML=`<div class="tape" aria-hidden="true"></div><h1>Tailor's Workbench</h1>
  <div class="label">${IC.star.replace('<svg','<svg width="20" height="20" style="color:var(--accent)"')} What will you make?</div>
  <div class="garments">
    <button class="gcard" id="g-shirt" data-g="shirt" aria-pressed="${isS}" aria-label="Shirt"><svg viewBox="-4 -6 168 166"><path d="${SH.shirt}" fill="#4f86d1" stroke="#1d3c69" stroke-width="4"/><path d="${SH.collar}" fill="#fff" stroke="#1d3c69" stroke-width="3"/><path d="M80 22 L80 148" stroke="#1d3c69" stroke-width="2"/></svg>Shirt</button>
    <button class="gcard" id="g-trousers" data-g="trousers" aria-pressed="${!isS}" aria-label="Trousers"><svg viewBox="-30 -4 150 168"><path d="${SH.pants}" fill="#66717d" stroke="#252b31" stroke-width="4"/><path d="M4 0 L86 0 L86 10 L4 10 Z" fill="#535d68"/></svg>Trousers</button>
  </div>
  <div class="label">Your size</div>
  <div class="sizes">${isS?Object.keys(SHIRT_SIZES).map((k,i)=>`<button class="sz" id="sz-${k}" data-size="${k}" aria-pressed="${S.shirtSize===k}">${shirtIcon(.75+i*.12)}${k}</button>`).join('')
     :PANT_SIZES.map(k=>`<button class="sz" id="sz-${k}" data-size="${k}" aria-pressed="${S.pantSize===k}">${pantIcon()}${k}</button>`).join('')}</div>
  <div class="toggles">
    ${isS?`<button class="tog" id="fit-reg" data-fit="regular" aria-pressed="${S.fit==='regular'}">Regular fit</button><button class="tog" id="fit-slim" data-fit="slim" aria-pressed="${S.fit==='slim'}">Slim fit</button>`:''}
    <button class="tog" id="u-in" data-u="in" aria-pressed="${S.unit==='in'}">inch</button><button class="tog" id="u-cm" data-u="cm" aria-pressed="${S.unit==='cm'}">cm</button>
    ${canSpeak?`<button class="tog" id="voice" data-voice aria-pressed="${S.voice}" aria-label="Voice">${S.voice?IC.say:IC.mute} Voice</button>`:''}
  </div>
  <div class="label">Step by step</div>
  <div class="path">${chs.map((c,i)=>{const seen=Math.min(S.seen[seenKey(c)]||0,c.steps.length),done=seen>=c.steps.length;
    return `<button class="ch ${done?'done':''} ${i===nextIdx?'next':''}" id="ch-${c.id}" data-ch="${i}"><span class="num">${done?'✓':i+1}</span>${chIcon(c.id)}<b>${c.name}</b><span class="bar"><i style="width:${seen/c.steps.length*100}%"></i></span></button>`;}).join('')}</div>`;
}
let cur=null;
function renderPlayer(say=true){
  const chs=chapters(),c=chs[S.view.ch],i=S.view.i,st=c.steps[i],k=seenKey(c);
  S.seen[k]=Math.max(S.seen[k]||0,i+1);save();
  const field=st.field,data=S.garment==='shirt'?S.shirt:S.pant;
  const last=i===c.steps.length-1;
  app.innerHTML=`<div class="player">
   <div class="pbar"><button class="icon-btn" id="b-home" aria-label="All steps">${IC.home}</button><div class="ptitle">${chIcon(c.id).replace('class="ci"','')}<span>${c.name}</span></div>
   <div class="dots">${c.steps.map((_,j)=>`<i class="${j===i?'cur':j<(S.seen[k]||0)?'on':''}"></i>`).join('')}</div></div>
   <div class="stage" id="stage" title="Tap to play again">${stageSvg(st.svg())}</div>
   <div class="cap"><span class="n">${i+1}/${c.steps.length}</span><span>${st.cap}</span></div>
   ${field?`<div class="stepper"><button id="f-minus" aria-label="Smaller">−</button><output id="f-val">${f(data[field])}</output><button id="f-plus" aria-label="Bigger">+</button></div>`:''}
   <div class="ctrls"><button class="big" id="b-prev" aria-label="Back" ${i===0&&S.view.ch===0?'disabled':''}>${IC.prev}</button>
     <button class="big round" id="b-replay" aria-label="Play again">${IC.replay}</button>
     ${canSpeak?`<button class="big round" id="b-say" aria-label="Say it">${IC.say}</button>`:'<span></span>'}
     <button class="big go" id="b-next" aria-label="${last?'Next chapter':'Next'}">${last&&S.view.ch===chs.length-1?IC.star:IC.next}</button></div></div>`;
  startStage();
  if(say&&S.voice)speak(stepSay(st));
}
const stepSay=st=>typeof st.say==='function'?st.say():(st.sayFn?st.sayFn():st.say);
function startStage(){const svg=document.querySelector('#stage svg');try{svg.setCurrentTime(0);svg.unpauseAnimations();}catch(e){}}
function replay(){const chs=chapters(),st=chs[S.view.ch].steps[S.view.i];document.getElementById('stage').innerHTML=stageSvg(st.svg());startStage();}
function render(){if(S.view)renderPlayer(false);else renderHome();}
function go(d){
  const chs=chapters();let {ch,i}=S.view;i+=d;
  if(i>=chs[ch].steps.length){if(ch<chs.length-1){ch++;i=0;}else{S.view=null;speak('');render();window.scrollTo({top:0});return;}}
  if(i<0){if(ch>0){ch--;i=chs[ch].steps.length-1;}else i=0;}
  S.view={ch,i};renderPlayer(true);
}
document.addEventListener('click',e=>{
  const tap=e.target.closest('[data-say]');if(tap){speak(tap.dataset.say);return;}
  const b=e.target.closest('button');
  if(!b){if(e.target.closest('#stage'))replay();return;}
  if(b.dataset.g){S.garment=b.dataset.g;save();render();return;}
  if(b.dataset.size){if(S.garment==='shirt'){S.shirtSize=b.dataset.size;S.shirt={...SHIRT_SIZES[S.shirtSize]};}else{S.pantSize=+b.dataset.size;S.pant=pantPreset(S.pantSize);}save();render();return;}
  if(b.dataset.fit){S.fit=b.dataset.fit;save();render();return;}
  if(b.dataset.u){S.unit=b.dataset.u;save();render();return;}
  if(b.hasAttribute('data-voice')){S.voice=!S.voice;if(!S.voice)speak('');save();render();return;}
  if(b.dataset.ch){S.view={ch:+b.dataset.ch,i:0};renderPlayer(true);window.scrollTo({top:0});return;}
  switch(b.id){
    case 'b-home':S.view=null;speak('');render();return;
    case 'b-next':go(1);return;
    case 'b-prev':go(-1);return;
    case 'b-replay':replay();return;
    case 'b-say':{const st=chapters()[S.view.ch].steps[S.view.i];speak(stepSay(st));return;}
    case 'f-minus':case 'f-plus':{const st=chapters()[S.view.ch].steps[S.view.i],data=S.garment==='shirt'?S.shirt:S.pant,stp=S.unit==='in'?.25:.5/2.54;
      data[st.field]=Math.max(1,data[st.field]+(b.id==='f-plus'?stp:-stp));save();document.getElementById('f-val').textContent=f(data[st.field]);replay();return;}
  }
});
document.addEventListener('keydown',e=>{if(!S.view)return;if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);});
render();
})();
</script>
